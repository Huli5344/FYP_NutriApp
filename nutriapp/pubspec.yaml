name: nutriapp_diary
description: Nutri App - Diary and Recommendations module.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0        # local SQLite, the source of truth for the interface
  path: ^1.8.3
  path_provider: ^2.1.1
  http: ^1.1.0           # talks to the Flask backend
  uuid: ^4.2.1           # client-generated entry ids, so devices never collide
  intl: ^0.19.0          # date formatting

  # NutriBot. Both arrived with the chatbot and are used nowhere else.
  #
  # shared_preferences holds the conversation. Deliberately NOT the app's
  # SQLite tables: the chat is not synced, so putting it in the synced
  # database would mean either adding it to the sync protocol or having one
  # table in there that silently does not travel between devices.
  shared_preferences: ^2.2.0
  # Replies come back as Markdown -- lists and simple tables are in the
  # system prompt's house style -- so they are rendered rather than shown raw.
  flutter_markdown_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # The Health Promotion Board food table, 2,692 rows, ~1.2 MB. Shipped in
    # the APK rather than fetched, so food search works with no connection
    # and costs the hosted database nothing. Read-only: db.dart copies it out
    # of the bundle on first run, because an asset cannot be opened in place.
    - assets/foods.db

    # One 1200x675 picture per food group, plus fallback.webp. Sixteen files,
    # about 94 KB in total. Shared by every food in a group rather than drawn
    # per item: 2,692 individual pictures is not a thing anybody was going to
    # make, and a group picture is honest about what it stands for.
    #
    # tools/check_food_images.py keeps the set and the dataset in step -- it
    # slugifies every group in foods.db the way foodGroupImage() does and
    # reports anything missing or orphaned.
    - assets/food_groups/

  fonts:
    # IBM Plex Sans, bundled rather than fetched at runtime: a release build
    # has to work offline, and a font that arrives late gives the first
    # launch an unstyled moment.
    #
    # Subset to Latin, Latin-1 and Latin Extended-A plus the punctuation the
    # interface uses, then checked against every character in foods.db --
    # 214 KB for three weights instead of 586 KB. Its figures are the reason
    # for choosing it: tabular numerals keep a column of calorie counts
    # aligned, which is most of what makes a table of numbers look
    # deliberate.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
