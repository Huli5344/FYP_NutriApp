org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off because the pub cache and this project
# are on different drives.
#
# Plugins written in Kotlin -- shared_preferences_android is one -- have their
# sources in the pub cache, typically under C:\Users\...\AppData. This project
# lives on F:. The incremental compiler stores each source path RELATIVE to the
# project root so its caches can be moved, and there is no relative path from a
# folder on F: to a file on C:. It throws
#
#   IllegalArgumentException: this and base files have different roots
#
# which surfaces as ":shared_preferences_android:compileDebugKotlin failed ...
# Could not close incremental caches". Nothing is wrong with the plugin or with
# this app; the two just cannot be on different drives with this switched on.
#
# Turning it off costs some rebuild time and nothing else. The alternative is
# to move the pub cache onto the same drive by setting PUB_CACHE, which fixes
# it globally but re-downloads every package.
kotlin.incremental=false
